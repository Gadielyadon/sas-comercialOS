<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sin conexión · AxSoft</title>
<style>
  :root{color-scheme:light dark}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f3f5f9;color:#111827}
  @media (prefers-color-scheme:dark){body{background:#0f172a;color:#e5e7eb}.card{background:#1e293b!important}}
  .card{background:#fff;border-radius:18px;padding:32px 28px;max-width:420px;width:90%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.15)}
  h1{font-size:22px;margin:0 0 8px}
  p{margin:0 0 20px;color:#6b7280;font-size:15px;line-height:1.5}
  a,button{display:block;width:100%;box-sizing:border-box;padding:14px;margin-top:10px;border:0;border-radius:12px;font-size:15px;font-weight:700;text-decoration:none;cursor:pointer}
  .pri{background:#1A5CFF;color:#fff}
  .sec{background:#e5e7eb;color:#111827}
  #pos{display:none}
</style>
</head>
<body>
<div class="card">
  <div style="font-size:44px">📡</div>
  <h1>Sin conexión a internet</h1>
  <p>Esta pantalla necesita internet. Si ya abriste el sistema antes en este equipo, podés seguir vendiendo: las ventas se guardan y se envían solas cuando vuelva la conexión.</p>
  <a id="pos" class="pri" href="/ventas">Abrir punto de venta</a>
  <button class="sec" onclick="location.reload()">Reintentar</button>
</div>
<script>
  // Si el punto de venta está guardado en este equipo, se ofrece abrirlo.
  if (window.caches) {
    caches.match('/ventas').then(function (r) { if (r) document.getElementById('pos').style.display = 'block'; });
  }
  window.addEventListener('online', function () { location.reload(); });
</script>
</body>
</html>
